<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>الصفحة غير موجودة | سجل البطولات الوطني</title>
<style>
  :root{--gold:#c9a227;--gold-2:#e8cf8b;--ink:#eaf3ee;--muted:#a9bfb4}
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;
    font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;color:var(--ink);
    background:
      radial-gradient(800px 500px at 50% -10%,rgba(201,162,39,.16),transparent 60%),
      radial-gradient(900px 700px at 50% 60%,#0a2618,#04120d 70%);
    padding:2rem;
  }
  img{width:104px;height:auto;margin:0 auto 1.4rem;filter:drop-shadow(0 0 26px rgba(18,161,84,.35))}
  .code{
    font-size:.78rem;letter-spacing:.4em;color:var(--gold-2);margin:0 0 .4rem;
  }
  h1{font-size:clamp(1.6rem,4vw,2.4rem);margin:0 0 .7rem;font-weight:700}
  p{color:var(--muted);margin:0 0 1.8rem;line-height:1.9}
  a{
    display:inline-block;padding:.75rem 1.9rem;border-radius:999px;text-decoration:none;
    color:#08150f;font-weight:700;
    background:linear-gradient(100deg,var(--gold-2),var(--gold));
    box-shadow:0 18px 40px -20px rgba(201,162,39,.9);
  }
  a:hover{filter:brightness(1.06)}
</style>
</head>
<body>
<main>
  <img src="/assets/img/emblem-green.svg" alt="شعار المملكة العربية السعودية" width="610" height="662">
  <p class="code">404</p>
  <h1>الصفحة غير موجودة</h1>
  <p>الرابط الذي طلبته غير متاح أو تم نقله إلى صفحة أخرى.</p>
  <a href="/">العودة إلى السجل</a>
</main>
</body>
</html>
